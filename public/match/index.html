<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1511">
<link rel="manifest" href="/match/manifest.webmanifest">
<link rel="apple-touch-icon" href="/match/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dragons Feuille de Match</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout : app une colonne, gros boutons pouces, lisible en plein soleil */
:root{
  /* Palette d'origine de la feuille de match (vert très foncé, accents verts) — référence de tout le site */
  --bg:#0E1511; --surface:#17211B; --ink:#E7EFEA; --muted:#9AADA2; --line:#2A3A31;
  --accent:#3FAE74; --accent-ink:#06130C; --accent-soft:#1B3527;
  --ball:#43C383; --strike:#FF7A45; --out:#F2665A; --warn:#F2B632; --warn-soft:#3A2E10; --bad-soft:#3E1A17;
  --f-num:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{min-height:52px;padding:0 16px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:0 12px;font-size:14px}
a.btn{color:var(--ink)}
.btn:disabled{opacity:.4}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.top h1{font:700 26px/1 var(--f-num);letter-spacing:.02em;text-transform:uppercase}

/* tableau d'affichage */
.board{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.board .team{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .score{font:700 40px/1 var(--f-num);font-variant-numeric:tabular-nums;text-align:center}
.board .right{text-align:right}
.inningbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--ink)}
.pill.def{background:var(--warn-soft)}
.outs{display:flex;gap:6px;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--out)}
.dot.on{background:var(--out)}

/* batteur */
.batter{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.batter>button{min-width:0;flex:1}
.batter .name{overflow-wrap:break-word;font:700 26px/1.05 var(--f-num);text-transform:uppercase;letter-spacing:.01em}
.batter .line{font-size:14px;color:var(--muted)}
.count{display:flex;gap:14px;align-items:center}
.count .big{font:700 44px/1 var(--f-num);white-space:nowrap;font-variant-numeric:tabular-nums}
.count .lbl{display:flex;flex-direction:column;gap:6px}
.lights{display:flex;gap:5px}
.lights i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;display:block}
.lights.b{color:var(--ball)} .lights.s{color:var(--strike)}
.lights i.on{background:currentColor}

.grid{display:grid;gap:8px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.key{min-height:60px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:4px}
.key b{font:700 22px/1 var(--f-num)}
.key small{font-size:11px;color:var(--muted);margin-top:3px;text-align:center}
.key.pitch{min-height:68px}
.key.pitch.b{border-color:var(--ball);color:var(--ball)}
.key.pitch.s{border-color:var(--strike);color:var(--strike)}
.key.hit{background:var(--accent-soft);border-color:var(--accent)}
.key.out{background:var(--bad-soft);border-color:transparent}
.key:active{transform:scale(.97)}
.key:disabled,.btn:disabled{opacity:.35}
.key.small{min-height:52px}
.runrow{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px}
.rname{font-weight:700}

.diamondwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
svg.diamond{width:100%;max-width:300px;height:auto}
.ondeck{font-size:14px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar button{min-height:50px;border-radius:10px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bar button.on{background:var(--accent-soft);color:var(--ink)}
.bar svg{width:20px;height:20px}

/* feuille modale */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{font:700 22px/1.1 var(--f-num);text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-height:52px;text-align:left;width:100%}
.item .n{font:700 20px/1 var(--f-num);width:28px;text-align:center;color:var(--muted)}
.item .grow{flex:1;min-width:0}
.item.sel{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
body:has(.sheet) .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:20;max-width:90vw;text-align:center}

/* lanceurs */
.pc{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pc .big{font:700 72px/0.9 var(--f-num);font-variant-numeric:tabular-nums}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:7px}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--out)}
.alert{padding:10px 12px;border-radius:10px;font-weight:700}
.alert.warn{background:var(--warn-soft)} .alert.bad{background:var(--bad-soft);color:var(--out)}
.plus{min-height:96px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 34px/1 var(--f-num);text-transform:uppercase}
.oppbox{display:flex;align-items:center;justify-content:space-between;gap:10px}
.oppbox .big{font:700 44px/1 var(--f-num);min-width:48px;text-align:center}
.round{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font:700 28px/1 var(--f-num)}

/* récap */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.l,th.l{text-align:left;padding-left:10px;position:sticky;left:0;background:var(--surface)}
tr:last-child td{border-bottom:0}
.tot td{font-weight:700}
.log{display:flex;flex-direction:column}
.log .inn{font:700 18px/1 var(--f-num);text-transform:uppercase;margin:14px 0 6px;color:var(--accent)}
.log .e{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.log .e .c{font-family:var(--f-num);font-weight:700;color:var(--muted);min-width:34px}
.log .e .runs{color:var(--accent);font-weight:700}
.playerline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.playerline:last-child{border-bottom:0}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--bg);font:700 14px/1.3 var(--f-num);margin:2px 2px 0 0}
.tag.h{background:var(--accent-soft)}
.empty{text-align:center;padding:28px 16px}
.net{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.net i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:block}
.net.ok i{background:var(--ball)} .net.sync i{background:var(--warn)} .net.off i,.net.err i,.net.auth i{background:var(--out)}
.ro{background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
@media (prefers-reduced-motion:reduce){.key:active{transform:none}}

/* Affichage : mobile (défaut) · tablette verticale (.lay-tp) · tablette horizontale (.lay-tl) */
.cols,.col{display:contents}
.ddia{display:flex;gap:12px;align-items:center}
.only-tl{display:none!important}
.lay-tl .only-tl{display:flex!important}.lay-tl .not-tl{display:none!important}
.lay-tp #app{max-width:860px;padding-inline:24px}
.lay-tp .bar .in,.lay-tp .sheet{max-width:860px}
.lay-tp,.lay-tl{font-size:18px}
.lay-tp .key,.lay-tl .key{min-height:78px}
.lay-tp .key.small,.lay-tl .key.small{min-height:62px}
.lay-tp .key b,.lay-tl .key b{font-size:30px}
.lay-tp .key small,.lay-tl .key small{font-size:13px}
.lay-tp .key.pitch,.lay-tl .key.pitch{min-height:84px}
.lay-tp .btn,.lay-tl .btn{min-height:58px}
.lay-tp .btn.small,.lay-tl .btn.small{min-height:46px;font-size:16px}
.lay-tp .batter .name,.lay-tl .batter .name{font-size:36px}
.lay-tp .count .big,.lay-tl .count .big{font-size:58px}
.lay-tp .board .score,.lay-tl .board .score{font-size:52px}
.lay-tp .board .team,.lay-tl .board .team{font-size:16px}
.lay-tp .label,.lay-tl .label{font-size:13px}
.lay-tp svg.diamond{max-width:400px}
.lay-tp .plus,.lay-tl .plus{min-height:110px;font-size:40px}
.lay-tp .bar button,.lay-tl .bar button{min-height:58px;font-size:15px}
.lay-tl #app{max-width:1500px;padding-inline:24px}
.lay-tl .bar .in{max-width:1500px}
.lay-tl .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.lay-tl .col{display:flex;flex-direction:column;gap:12px;min-width:0}
.lay-tl svg.diamond{max-width:340px}
.lay-tl .sheet-bg{align-items:center}
.lay-tl .sheet{max-width:640px;border-radius:18px}
/* terrain de saisie des frappes : le plus grand possible */
.sheet.spr{gap:8px;max-height:98dvh;padding-top:12px}
.sheet.spr h3{font-size:19px}
.sheet.spr .fld svg{width:100%!important;max-width:none!important;height:auto;max-height:calc(100dvh - 190px);cursor:crosshair}
.lay-tl .sheet.spr,.lay-tp .sheet.spr{max-width:min(96vw,1000px)}
.lay-tl .sheet.spr .fld svg{height:calc(100dvh - 170px)}
.sprcols{display:grid;gap:12px}
@media (min-width:900px){.sprcols{grid-template-columns:1fr 1fr}}
.lay-tl .sprcols{grid-template-columns:1fr 1fr}
.lay-tp .cols.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.lay-tp .cols.two>.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.lay-tl .runrows{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lay-tl .runrows>.label{grid-column:1/-1}
.lay-tl .hdr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px}
.lay-tl .hdr .top{margin:0}.lay-tl .hdr .hdate{display:none}
.lay-tl .hdr .ctl{margin-top:0!important;flex-wrap:nowrap}
.lay-tl .board{padding:6px 16px}.lay-tl .board .score{font-size:40px}
.lay-tl .key{min-height:66px}.lay-tl .key.pitch{min-height:72px}.lay-tl .key b{font-size:28px}
.lay-tl .plus{min-height:84px}
.lay-tl .inningbar{margin-top:0}
.lay-tl #app.narrow{max-width:980px}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script src="/version.js"></script>
<script src="/logos/logos.js"></script>
<script src="/match/scorecard.js"></script>
<script src="/match/spray.js"></script>
<script>
/* ============ Données ============ */
const KEY='dragons-feuille-club-v1';
const TOKEN_KEY='dragons-session-token';
const RES={
  '1B':['1B','Simple','hit'],'2B':['2B','Double','hit'],'3B':['3B','Triple','hit'],'HR':['HR','Home run','hit'],
  'BB':['BB','Walk','on'],'HBP':['HBP','Hit by pitch','on'],'E':['E','Error','on'],'FC':['FC','Fielder’s choice','on'],
  'K':['K','Strikeout','out'],'GO':['GO','Ground out','out'],'FO':['FO','Fly out','out'],'SAC':['Sac','Sacrifice','out'],
  'KD':['K3','Dropped 3rd strike','on'],'CI':['CI','Catcher’s interference','on']
};
const DPL={KD:'strikeout · 3e strike échappé',BB:'walk',HBP:'hit by pitch',WP:'wild pitch',K:'strikeout',PB:'passed ball',BK:'balk'};
const NOTES=['Bras faible CF','Bras faible LF','Bras faible RF','Catcher lent sur les vols','Pitcher lent au marbre','Défense joue profond','3B joue loin','Pitcher : 1er lancer strike','Pitcher ne regarde pas le coureur'];

const uid=()=>Math.random().toString(36).slice(2,9);
let db=load();
function blank(){return{hidden:[],claimed:[],roster:[],matches:{},current:null,settings:{limit:90,warn:75},device:uid()+uid(),role:null,user:null,cal:[],lineups:{},deleted:[]}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.matches)return Object.assign(blank(),d)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Sauvegarde impossible sur ce navigateur')}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>db.roster.find(p=>p.id===id)||{name:(M()&&M().names&&M().names[id])||'?',num:''};
const SC=()=>db.role==='scorer';
const POSL={P:'lanceur',C:'receveur','1B':'1re base','2B':'2e base','3B':'3e base',SS:'arrêt-court',LF:'champ gauche',CF:'champ centre',RF:'champ droit',DH:'DH'};
const POSORD=['P','C','1B','2B','3B','SS','LF','CF','RF','DH'];
const APP2POS={'Lanceur':'P','Catcher':'C','Première base':'1B','Deuxième base':'2B','Troisième base':'3B','Arrêt-court':'SS','Champ gauche':'LF','Champ centre':'CF','Champ droit':'RF'}; // scoreuse : lecture seule, noms complets, saisie du line-up adverse
const nm=id=>SC()?(P(id).full||P(id).name):P(id).name;
const today=()=>new Date().toISOString().slice(0,10);
const M=()=>db.matches[db.current];

/* ============ Moteur : on rejoue les actions ============ */
function replay(m){
  const first=m.first||(m.home?'def':'att');
  const s={do:0,dB:[false,false,false],dh:m.dh||null,catcher:m.catcher||null,df:{},first,inn:1,half:first,b:0,s:0,o:0,B:[null,null,null],bat:0,lineup:m.lineup.slice(),us:{},opp:{},st:{},log:[],over:false,lastPA:null,pitcher:m.pitcher||null,reentry:m.kind==='amical',pos:Object.assign({},m.pos||{}),pc:{},gone:[],dhEnded:false,paLog:null,obi:0,opa:[],subsNow:[],lastPlayT:0,anyPlay:false,pitched:m.pitcher?[m.pitcher]:[]};
  const S=id=>s.st[id]||(s.st[id]={cs:0,e:0,pa:0,ab:0,h:0,d:0,t:0,hr:0,r:0,rbi:0,bb:0,hbp:0,k:0,sb:0,res:[]});
  s.lineup.forEach(S);
  // postes en défense : depuis la compo (m.pos), complétés par lanceur / receveur / DH
  const setPos=(id,p)=>{if(!id)return;Object.keys(s.pos).forEach(k=>{if(s.pos[k]===p&&k!==id&&p!=='')delete s.pos[k]});s.pos[id]=p};
  if(s.pitcher&&s.pos[s.pitcher]!=='P')setPos(s.pitcher,'P');
  if(s.catcher&&!s.pos[s.catcher])setPos(s.catcher,'C');
  if(s.dh&&!s.pos[s.dh])s.pos[s.dh]='DH';
  let curT=0;const L=(o)=>s.log.push(Object.assign({inn:s.inn,half:s.half,tt:curT},o));
  const score=(id,rbiTo)=>{s.us[s.inn]=(s.us[s.inn]||0)+1;S(id).r++;if(rbiTo)S(rbiTo).rbi++};
  const oppRun=()=>{s.opp[s.inn]=(s.opp[s.inn]||0)+1};
  const dForce=()=>{const B=s.dB;if(B[0]){if(B[1]){if(B[2])oppRun();B[2]=true}B[1]=true}B[0]=true};
  const dAdv=n=>{const B=s.dB;for(let i=2;i>=0;i--)if(B[i]){B[i]=false;const t=i+n;if(t>=3)oppRun();else B[t]=true}};
  // Frappe adverse : seuls les coureurs forcés avancent (le minimum), les autres restent
  const dPush=b=>{const B=s.dB;if(b>=3){oppRun();return}if(B[b])dPush(b+1);B[b]=true};
  const dHit=k=>{const B=s.dB;for(let j=0;j<=k;j++){if(j>0)B[j-1]=false;dPush(j)}};
  const dOut=()=>{s.do++;if(s.do>=3){L({t:'end'});endHalf()}};
  const endHalf=()=>{s.half=s.half==='att'?'def':'att';if(s.half===s.first)s.inn++;s.b=0;s.s=0;s.o=0;s.B=[null,null,null];s.lastPA=null;s.do=0;s.dB=[false,false,false]};
  const pa=(res,fcOut)=>{let fcRec=null;
    const id=s.lineup[s.bat],p=S(id),B=s.B,count=Math.min(s.b,3)+'-'+Math.min(s.s,2),sc=[];
    p.pa++;p.res.push(res);if(!['BB','HBP','SAC','CI'].includes(res))p.ab++;
    const force=()=>{if(B[0]){if(B[1]){if(B[2])sc.push(B[2]);B[2]=B[1]}B[1]=B[0]}B[0]=id};
    // Coup sûr : le frappeur passe base par base, il ne pousse que les coureurs forcés (minimum) ; les autres restent
    const pushAt=(b,who)=>{if(b>=3){sc.push(who);return}if(B[b])pushAt(b+1,B[b]);B[b]=who};
    const hit=k=>{for(let j=0;j<=k;j++){if(j>0)B[j-1]=null;pushAt(j,id)}};
    switch(res){
      case'BB':p.bb++;force();break; case'HBP':p.hbp++;force();break; case'E':force();break;
      case'1B':p.h++;hit(0);break; case'2B':p.h++;p.d++;hit(1);break;
      case'3B':p.h++;p.t++;hit(2);break; case'HR':p.h++;p.hr++;for(let i=2;i>=0;i--)if(B[i]){sc.push(B[i]);B[i]=null}sc.push(id);break;
      case'K':p.k++;s.o++;break; case'GO':case'FO':s.o++;break; case'SAC':s.o++;break;

let auth='checking', net='idle';

async function syncNow(){
  if(syncing)return;
  const dirty=Object.values(db.matches).filter(m=>m.dirty&&mine(m));
  if(!dirty.length&&!db.deleted.length){if(net!=='ok')setNet('ok');return}
  syncing=true;setNet('sync');
  try{
    for(const id of db.deleted.slice()){await api({action:'deleteScoresheet',sheetId:id});db.deleted=db.deleted.filter(x=>x!==id);save()}
    for(const m of dirty){
      const sent=m.updated;const r=await api({action:'saveScoresheet',sheet:strip(m),pub:m.live?pubOf(m):undefined});
      const cur=db.matches[m.id];
      if(r.conflict){db.matches[m.id]=Object.assign(r.sheet,{synced:true});toast('Une autre tablette saisit ce match : sa version est reprise');render()}
      else if(cur&&cur.updated===sent){delete cur.dirty;cur.synced=true}
      else if(cur)cur.synced=true;
      save();
    }
    syncing=false;setNet('ok');
  }catch(e){syncing=false;setNet(netErr(e))}

async function pull(){
  if(auth!=='ok'&&auth!=='offline')return;
  try{
    const r=await api({action:'getScoresheets'});const srv=r.sheets||[];const ids=new Set(srv.map(x=>x.id));
    if(view==='live'||tab==='adv'){try{const o=await api({action:'getOppLineups'});const before=JSON.stringify(db.opp||{});const keep=Object.values(db.opp||{}).filter(x=>!x.updated);db.opp={};(o.lineups||[]).forEach(l=>{db.opp[l.sheetId]=l});keep.forEach(x=>{if(!db.opp[x.sheetId])db.opp[x.sheetId]=x});if(JSON.stringify(db.opp)!==before&&view==='live'&&!(document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName))&&!document.querySelector('.sheet'))render()}catch(e){}}
    for(const sh of srv){const loc=db.matches[sh.id];
      if(db.deleted.includes(sh.id))continue;
      if(!loc||((!loc.dirty||!mine(loc))&&(sh.updated||0)>(loc.updated||0)))db.matches[sh.id]=Object.assign(sh,{synced:true})}
    for(const m of Object.values(db.matches))if(!ids.has(m.id)&&m.synced&&!m.dirty)delete db.matches[m.id];
    if(db.current&&!db.matches[db.current]){db.current=null;view='home'}
    save();if(auth==='offline')auth='ok';
    if(net!=='sync')setNet('ok');
    if((view==='home'||(view==='live'&&M()&&!mine(M())))&&!(tab==='adv'&&document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName)))render();
  }catch(e){if(net!=='sync')setNet(netErr(e))}
}

  return r.map(p=>{const pr=(p.prenom||'').trim(),no=(p.nom||'').trim();let name=pr||no||'?';
    if(pr&&cnt[key(pr)]>1&&no)name=pr+' '+no[0]+'.';return{id:p.id,name,num:p.numero||'',full:(pr+' '+no).trim()}})
    .sort((a,b)=>a.name.localeCompare(b.name,'fr'));
}

const SPRAY_RES=['1B','2B','3B','HR','E','FC','GO','FO','SAC'];

  const e=m.events[m.events.length-1];if(!e)return;

  sheet(`<h3 style="margin-bottom:2px">Où est partie la balle ?</h3><p class="muted" style="margin:0 0 6px">${who} · <b style="color:${DragonsSpray.COL[DragonsSpray.cat(res)]}">${esc(lab)}</b> — touche le terrain là où la balle a été jouée${DragonsSpray.cat(res)==='out'?' ou attrapée':''}</p>

async function pushResults(){
  const m=M(),s=replay(m),c=db.cal.find(x=>x.id===m.linkedMatchId);
  const n=Math.min(7,s.inn),col=o=>Array.from({length:7},(_,i)=>i<n?(o[i+1]||0):null);
  const dr=col(s.us),ad=col(s.opp);
  if(s.inn>7){dr[6]=Object.entries(s.us).filter(([k])=>+k>=7).reduce((a,[,v])=>a+v,0);ad[6]=Object.entries(s.opp).filter(([k])=>+k>=7).reduce((a,[,v])=>a+v,0)}
  try{await api({action:'setInnings',matchId:m.linkedMatchId,dragons:dr,adversaire:ad});toast('Score envoyé dans Résultats'+(c?' · '+c.label:''))}
  catch(e){toast(e.status?e.message:'Pas de réseau · réessaie plus tard')}
}
function recapRows(m,s){

}
const avg=(h,ab)=>ab?(h/ab).toFixed(3).replace(/^0/,''):'—';
let sprWho='';
function sprayPts(m){const us=[],them=[];const all=oppAll(m);
  m.events.forEach(e=>{if(!e.loc)return;
    if(e.k==='PA')us.push({loc:e.loc,res:e.res,bt:e.bt,who:e.b||'',title:(e.b?nm(e.b)+' · ':'')+(RES[e.res]?RES[e.res][1]:e.res)});
    else if(e.k==='DHIT'||e.k==='DOUT'){const p=e.obk&&all.find(x=>x.key===e.obk);them.push({loc:e.loc,res:e.k==='DHIT'?e.v:'OUT',bt:e.bt,who:e.obk||'',title:(p?((p.prenom||'')+(p.num?' #'+p.num:'')).trim()+' · ':'')+(e.k==='DHIT'?e.v:'Out')})}});
  return{us,them}}
let sprWhoT='';
function sprayV(m){const P2=sprayPts(m);
  const col=(side)=>{const pts=P2[side],sel=side==='us'?sprWho:sprWhoT;
    const whoL=[...new Set(pts.map(p=>p.who).filter(Boolean))].map(k=>{if(side==='us')return[k,nm(k)];const p=oppAll(m).find(x=>x.key===k);return[k,p?((p.num?'#'+p.num+' ':'')+(p.prenom||'')+' '+(p.nom||'').toUpperCase()).trim():'?']}).sort((a,b)=>a[1].localeCompare(b[1],'fr'));
    const who=whoL.some(([k])=>k===sel)?sel:'',shown=who?pts.filter(p=>p.who===who):pts,h=shown.filter(p=>DragonsSpray.cat(p.res)==='hit').length;
    return `<div class="card stack"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b style="font-size:17px">${side==='us'?'Dragons en attaque':esc(shortT(m.opp))+' en attaque'}</b><span class="muted" style="font-size:14px">${shown.length} balle${shown.length>1?'s':''} · ${h} hit${h>1?'s':''}</span></div>
    ${whoL.length?`<select data-sprwho="${side}" aria-label="Joueur"><option value="">Toute l’équipe</option>${whoL.map(([k,l])=>`<option value="${esc(k)}" ${k===who?'selected':''}>${esc(l)}</option>`).join('')}</select>`:''}
    ${DragonsSpray.svg(shown,{max:520})}${DragonsSpray.legend()}${shown.length?DragonsSpray.summary(shown):`<p class="muted" style="margin:0;text-align:center">Aucune frappe placée.</p>`}</div>`};
  return `${sprMode(m)?'':`<div class="alert warn">Localisation des frappes désactivée pour ce match${SC()?'':' · active-la dans l’onglet Line-up'}.</div>`}
  <div class="sprcols">${col('us')}${sprMode(m)==='all'||P2.them.length?col('them'):''}</div>`}
function recapV(m,s){
  const inns=Math.max(7,dispInn(s));

  const T=rows.reduce((a,r)=>{for(const k of['pa','ab','h','d','t','hr','r','rbi','bb','hbp','k','sb','cs','e'])a[k]=(a[k]||0)+r[k];return a},{});
  const pcs=Object.entries(s.pc).filter(([,n])=>n>0);
  return `<div class="tablewrap"><table><thead><tr><th class="l">Inning</th>${Array.from({length:inns},(_,i)=>`<th>${i+1}</th>`).join('')}<th>Pts</th></tr></thead><tbody>
    <tr><td class="l"><b>Dragons</b></td>${Array.from({length:inns},(_,i)=>`<td>${s.us[i+1]??(i+1<=s.inn?0:'')}</td>`).join('')}<td><b>${sum(s.us)}</b></td></tr>
    <tr><td class="l">${esc(m.opp)}</td>${Array.from({length:inns},(_,i)=>`<td>${s.opp[i+1]??(i+1<=s.inn?0:'')}</td>`).join('')}<td><b>${sum(s.opp)}</b></td></tr></tbody></table></div>
  <div class="label">Stats par joueur</div>
  <div class="tablewrap"><table><thead><tr><th class="l">Joueur</th><th>PA</th><th>AB</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>R</th><th>RBI</th><th>BB</th><th>HBP</th><th>K</th><th>SB</th><th>CS</th><th>AVG</th><th>E</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="l">${esc(nm(r.id))}</td><td>${r.pa}</td><td>${r.ab}</td><td>${r.h}</td><td>${r.d}</td><td>${r.t}</td><td>${r.hr}</td><td>${r.r}</td><td>${r.rbi}</td><td>${r.bb}</td><td>${r.hbp}</td><td>${r.k}</td><td>${r.sb}</td><td>${r.cs||''}</td><td>${avg(r.h,r.ab)}</td><td>${r.e||''}</td></tr>`).join('')}
  <tr class="tot"><td class="l">Équipe</td><td>${T.pa||0}</td><td>${T.ab||0}</td><td>${T.h||0}</td><td>${T.d||0}</td><td>${T.t||0}</td><td>${T.hr||0}</td><td>${T.r||0}</td><td>${T.rbi||0}</td><td>${T.bb||0}</td><td>${T.hbp||0}</td><td>${T.k||0}</td><td>${T.sb||0}</td><td>${T.cs||0}</td><td>${avg(T.h||0,T.ab||0)}</td><td>${T.e||0}</td></tr></tbody></table></div>
  <div class="card">${rows.map(r=>`<div class="playerline"><b>${esc(nm(r.id))}</b><span style="text-align:right">${r.res.map(x=>`<span class="tag ${RES[x][2]==='hit'?'h':''}">${RES[x][0]}</span>`).join('')||'<span class="muted">—</span>'}</span></div>`).join('')}</div>

  <div class="label">Toutes les actions</div>
  <div class="card log">${logV(s)||'<span class="muted">Aucune action pour l’instant.</span>'}</div>
  <button class="btn" data-a="copy">Copier le récap (texte)</button>
  <button class="btn" data-a="scoreimg">Image du score à partager</button>
  ${m.linkedMatchId?`<button class="btn primary" data-a="pushres">Envoyer le score dans Résultats</button><p class="muted" style="margin:-6px 0 0;font-size:13px">Remplace le score par inning de « ${esc((db.cal.find(x=>x.id===m.linkedMatchId)||{}).label||'ce match')} » dans l’appli.</p>`:''}`;

function defTable(m,s){
  const ids=[...new Set([...Object.keys(s.df),...Object.keys(s.pc).filter(k=>s.pc[k]>0),...Object.keys(s.st).filter(k=>s.st[k].e)])];

  return `<div class="label">Défense de nos joueurs</div><div class="tablewrap"><table><thead><tr><th class="l">Joueur</th><th>Lancers</th><th>K</th><th>BB</th><th>HBP</th><th>WP</th><th>PB</th><th>BK</th><th>E</th></tr></thead><tbody>${ids.map(id=>{const d=s.df[id]||{};const z=v=>v||'';return`<tr><td class="l">${esc(nm(id))}</td><td>${z(s.pc[id])}</td><td>${z(d.k)}</td><td>${z(d.bb)}</td><td>${z(d.hbp)}</td><td>${z(d.wp)}</td><td>${z(d.pb)}</td><td>${z(d.bk)}</td><td>${z(s.st[id]?.e)}</td></tr>`}).join('')}</tbody></table></div>`;
}
function logLine(e){

  if(e.t==='run'&&e.a==='err')return e.to>=3?`<span class="runs">${esc(nm(e.id))} marque sur erreur</span>`:`${esc(nm(e.id))} avance en ${['','2e','3e'][e.to]} sur erreur`;
  if(e.t==='run'){const b=['1re','2e','3e'][e.base];return e.a==='cs'?`<span style="color:var(--out)">${esc(nm(e.id))} pris en vol (depuis la ${b})</span>`:e.a==='out'?`${esc(nm(e.id))} out en ${b} base`:['wp','pb'].includes(e.a)?`${esc(nm(e.id))} ${e.to>=3?'marque':'avance en '+['','2e','3e'][e.to]} (${e.a==='wp'?'wild pitch':'passed ball'})`:e.a==='sb'?`${esc(nm(e.id))} vole ${e.to>=3?'le marbre':['','la 2e','la 3e'][e.to]}`:e.to>=3?`<span class="runs">${esc(nm(e.id))} marque</span>`:`${esc(nm(e.id))} avance en ${['','2e','3e'][e.to]}`}

  if(e.t==='note')return`Note : ${esc(e.txt)}`;

/* journal complet : nos actions + changements adverses (saisis par la scoreuse) à leur place */
function fullLog(m,s){const l=(db.opp||{})[m.id],subs=(l&&l.subs||[]).slice().sort((a,b)=>(a.at||0)-(b.at||0)),out=[];let k=0;
  s.log.forEach((e,i)=>{out.push(e);const nxt=s.log[i+1];while(k<subs.length&&(!nxt||(nxt.tt||0)>(subs[k].at||0))&&(e.tt||0)<=(subs[k].at||0)){out.push({t:'osub',x:subs[k],inn:e.inn,half:e.half,team:shortT(l.team||m.opp)});k++}});
  while(k<subs.length){const x=subs[k++];out.push({t:'osub',x,inn:x.inn,half:s.half,team:shortT(l.team||m.opp)})}return out}
const dispInn=s=>s.over?Math.max(1,...s.log.filter(e=>e.t!=='end').map(e=>e.inn)):s.inn;
function logV(s){
  let out='',cur='';
  for(const e of fullLog(M(),s)){const l=logLine(e);if(!l)continue;const k=e.inn+e.half;if(k!==cur){cur=k;out+=`<div class="inn">${e.half===s.first?'Top':'Bottom'} ${e.inn} · ${e.half==='att'?'attaque':'défense'}</div>`}out+=`<div class="e"><span>${l}</span></div>`}
  return out;
}
function recapText(){
  const m=M(),s=replay(m),rows=recapRows(m,s);
  let t=`Dragons ${sum(s.us)} – ${sum(s.opp)} ${m.opp} (${fmtDate(m.date)})\n\n`;
  t+=rows.map(r=>`${nm(r.id)} : ${r.h}/${r.ab}${r.r?`, ${r.r} pt`:''}${r.rbi?`, ${r.rbi} RBI`:''}${r.bb?`, ${r.bb} BB`:''}${r.k?`, ${r.k} K`:''}${r.sb?`, ${r.sb} SB`:''}${r.cs?`, ${r.cs} CS`:''}${r.e?`, ${r.e} E déf.`:''} — ${r.res.map(x=>RES[x][0]).join(' ')}`).join('\n');
  const pcs=Object.entries(s.pc).filter(([,n])=>n>0);
  const dids=[...new Set([...Object.keys(s.df),...pcs.map(x=>x[0])])];
  if(dids.length)t+='\n\nDéfense :\n'+dids.map(id=>{const d=s.df[id]||{};return `${nm(id)} : `+[s.pc[id]&&s.pc[id]+' lancers',d.k&&d.k+' K',d.bb&&d.bb+' BB',d.hbp&&d.hbp+' HBP',d.wp&&d.wp+' WP',d.pb&&d.pb+' PB',d.bk&&d.bk+' BK',s.st[id]?.e&&s.st[id].e+' E'].filter(Boolean).join(', ')}).join('\n');
  t+='\n\nDéroulé :\n'+fullLog(m,s).map(e=>{const l=logLine(e);return l?`M${e.inn} ${l.replace(/<[^>]+>/g,'')}`:null}).filter(Boolean).join('\n');
  return t;
}

      push({k:'PA',res:v});sprayAsk(v,s0.lineup[s0.bat]);toast(v==='KD'?(s0.B[0]&&s0.o<2?'1re occupée avec moins de 2 retraits : le frappeur est retiré':'3e strike échappé · le frappeur court en 1re'):RES[v][1]);break}
    case'fcgo':{const s0=replay(m);close();push(v?{k:'PA',res:'FC',out:v}:{k:'PA',res:'FC'});sprayAsk('FC',s0.lineup[s0.bat]);toast('Fielder’s choice');break}
    case'runner':if(replay(m).B[+v])runnerSheet(+v);break;
    case'r':{const[i,act]=v.split(':');close();push({k:'R',i:+i,a:act});break}
    case'subsheet':subSheet(+v);break;
    case'sub':{const[slot,id]=v.split(':'),s0=replay(m);
      if(s0.gone.includes(id)&&!s0.reentry){toast(nm(id)+' est sorti du match : pas de réentrée (match de saison)');break}
      close();push({k:'SUB',slot:+slot,id,run:true});
      const s1=replay(M());toast(s0.dh&&!s1.dh?'Changement noté · fin du DH, le pitcher frappe':'Changement noté');break}
    case'pchsheet':pchSheet();break;
    case'catsheet':catSheet();break;
    case'cat':close();push({k:'CAT',id:v});break;
    case'dp':{if(v==='BK'&&!t.dataset.pc&&replay(m).pitcher){sheet(`<h3>Balk</h3><p class="muted" style="margin:0">${esc(nm(replay(m).pitcher))} a-t-il lancé la balle vers le frappeur ?</p><div class="grid" style="grid-template-columns:1fr 1fr"><button class="key hit" data-a="dp" data-v="BK" data-pc="1"><b>Oui</b><small>+1 lancer</small></button><button class="key" data-a="dp" data-v="BK" data-pc="0"><b>Non</b><small>pas de lancer</small></button></div><button class="btn" data-a="close">Annuler</button>`);break}
      if(t.dataset.pc)close();
      const st0=replay(m),before=st0.half;push(Object.assign({k:'DP',kind:v},(['K','KD','BB','HBP','WP','PB'].includes(v)||t.dataset.pc==='1')&&st0.pitcher?{pc:1}:{}));const st1=replay(M()),pts=sum(st1.opp)-sum(st0.opp);
      toast(before==='def'&&st1.half==='att'?'3 outs · on passe en attaque':pts>0?`Point adverse : ${v==='BK'?'balk avec un coureur en 3e':'bases pleines, coureur de 3e poussé au marbre'}`:(v==='WP'||v==='PB')&&before==='def'&&st0.dB.some(Boolean)?DPL[v]+' · touche la base des coureurs qui ont avancé':DPL[v]+((['K','KD','BB','HBP','WP','PB'].includes(v)||t.dataset.pc==='1')&&st0.pitcher?' · +1 lancer':''));break}
    case'dersheet':derSheet();break;
    case'der':close();push({k:'DE',id:v});toast('Error notée : '+nm(v));break;
    case'pch':{const s0=replay(m),old=s0.pitcher,nw=v;
      if(s0.gone.includes(nw)&&!s0.reentry){toast(nm(nw)+' est sorti du match : pas de réentrée (match de saison)');break}
      if(!old||old===nw){close();push({k:'PCH',id:nw});break}
      const slots=(skip,first)=>s0.lineup.map((id,i)=>({id,i})).filter(o=>o.id!==skip).sort((a,b)=>(b.i===first)-(a.i===first));
      const item=(o,who,dhe,tag)=>`<button class="item" data-a="pchgo" data-v="${nw}|${who}|${o.i}|${dhe}"><span class="n">${o.i+1}</span><span class="grow">à la place de <b>${esc(nm(o.id))}</b>${tag||''}</span></button>`;
      if(s0.dh){
        const inLine=s0.lineup.includes(nw),dhSlot=s0.lineup.indexOf(s0.dh);
        sheet(`<h3>${esc(nm(nw))} au monticule</h3>
          ${inLine?`<div class="alert warn">${esc(nm(nw))} est déjà dans l’ordre : <b>fin du DH</b> (règle 5.11), le pitcher frappe à sa place actuelle.</div>`:`<p class="muted" style="margin:0">Si ${esc(nm(old))} sort du match, le DH continue.</p>`}
          <div class="label">Et ${esc(nm(old))} (ancien pitcher) ?</div>
          <div class="list"><button class="item" data-a="pchgo" data-v="${nw}|||${inLine?1:0}"><span class="grow"><b>Sort du match</b></span></button></div>
          <div class="label">Va en défense${inLine?'':' → fin du DH'}, il frappe…</div>
          <div class="list">${slots(nw,dhSlot).map(o=>item(o,old,1,o.id===s0.dh?' <span class="tag h">DH</span>':'')).join('')}</div>
          <button class="btn" data-a="close">Annuler</button>`);
      }else if(!s0.lineup.includes(nw)){
        const os=s0.lineup.indexOf(old);
        sheet(`<h3>${esc(nm(nw))} au monticule</h3><p class="muted" style="margin:0">Sans DH, le pitcher frappe : il prend la place de qui dans l’ordre ?</p>
          <div class="list">${slots(null,os).map(o=>item(o,nw,0,o.i===os?' <span class="muted">· ancien pitcher</span>':'')).join('')}</div>
          <button class="btn small ghost" data-a="pchgo" data-v="${nw}|||0">Ne pas toucher à l’ordre</button>
          <button class="btn" data-a="close">Annuler</button>`);
      }else{close();push({k:'PCH',id:nw});toast(nm(nw)+' lance · pense à remplacer son poste en défense')}
      break}
    case'pchgo':{const[nw,who,slot,dhe]=v.split('|'),g=uid();close();
      {const s0=replay(m);m.events.push(Object.assign({k:'PCH',id:nw,g,t:Date.now()},who||s0.lineup.includes(s0.pitcher)?{}:{out:s0.pitcher}))}
      if(who)m.events.push({k:'SUB',slot:+slot,id:who,g,t:Date.now()});
      if(dhe==='1')m.events.push({k:'DHEND',g,t:Date.now()});
      m.names=m.names||{};[nw,who].filter(Boolean).forEach(x=>m.names[x]=nm(x));touch(m);render();
      toast(dhe==='1'?'Changement noté · fin du DH':'Changement de pitcher noté');break}
    case'pt':push({k:'PT',d:+v});
      {const s=replay(M()),lim=+db.settings.limit||90,n=(s.pc[s.pitcher]||0)+dayPitches(s.pitcher,m.date,m.id);if(+v>0&&n===lim)toast(`Limite de ${lim} atteinte`);else if(+v>0&&n===(+db.settings.warn||75))toast(`${lim-n} lancers restants`)}
      break;
    case'dout':{const before=replay(m).half;push({k:'DOUT',d:+v});if(+v>0&&before==='def')sprayAsk('OUT',null,true);if(before==='def'&&replay(M()).half==='att')toast('3 outs · on passe en attaque');break}
    case'db':push({k:'DB',i:+v});break;
    case'ot':push({k:'OT',n:+v});toast(v==='1'?'Erreur pick‑off · +1 base':'Erreur de relais · +2 bases');break;
    case'dot':push({k:'DOT',n:+v});toast((v==='1'?'Erreur pick‑off · +1 base':'Erreur de relais · +2 bases')+' · pense au « + Error » si c’est un de nos joueurs');break;
    case'ob':push({k:'OB',d:+v});break;
    case'possheet':{const s0=replay(m),cur=s0.pos[v]||'';if(v===s0.pitcher){toast('Pour changer de lanceur : onglet Jeu, en défense, « Changer »');break}
      sheet(`<h3>${esc(nm(v))} · poste</h3><p class="muted" style="margin:0">Actuellement : ${cur?POSL[cur]:'non renseigné'}. Si le poste est déjà pris, les deux joueurs échangent. L’ordre au bâton ne change pas.</p>
      <div class="grid g3">${POSORD.filter(p=>p!=='P'&&(p!=='DH'||s0.dh)).map(p=>{const who=Object.keys(s0.pos).find(k=>s0.pos[k]===p&&k!==v);return`<button class="key ${p===cur?'hit':''} small" data-a="posset" data-v="${v}|${p}"><b>${p}</b><small>${who?esc(nm(who)):POSL[p]}</small></button>`}).join('')}</div><button class="btn" data-a="close">Annuler</button>`);break}
    case'posset':{const[id,pos]=v.split('|');close();push({k:'POS',id,pos});const lg=replay(M()).log.filter(x=>x.t==='pos').slice(-1)[0];toast(`${nm(id)} → ${POSL[pos]}${lg&&lg.other?' · '+nm(lg.other)+(lg.from?' → '+POSL[lg.from]:''):''}`);break}
    case'osub':{const l=(db.opp||{})[m.id];if(!l)break;const outP=v==='P'?l.pitcher:l.order[+v];if(!outP)break;
      sheet(`<h3>Remplacer ${oppName(outP)}</h3><p class="muted" style="margin:0">${v==='P'?'Lanceur adverse':(+v+1)+'<sup>e</sup> dans l’ordre adverse'} · noté en ${halfLab(replay(m))} ${replay(m).inn}</p>
        ${(l.bench||[]).length?`<div class="label">Depuis le banc</div><div class="list">${l.bench.map((p,i)=>`<button class="item" data-a="osubgo" data-v="${v}|${i}"><span class="grow"><b>${oppName(p)}</b></span></button>`).join('')}</div>`:''}
        <div class="label">Nouveau joueur</div><div class="row" style="flex-wrap:nowrap"><input id="osNum" placeholder="N°" inputmode="numeric" style="width:64px;flex:none"><input id="osPre" placeholder="Prénom"><input id="osNom" placeholder="NOM"></div>
        <button class="btn primary" data-a="osubgo" data-v="${v}|new">Valider le changement</button><button class="btn" data-a="close">Annuler</button>`);break}
    case'osubgo':{if(SC()&&!ev._fresh){const sel=v,gv=id=>((document.getElementById(id)||{}).value||'').trim();window.__osNew={num:gv('osNum'),prenom:gv('osPre'),nom:gv('osNom')};close();toast('Synchronisation…');pull().then(()=>{const b=document.createElement('button');b.dataset.a='osubgo';b.dataset.v=sel;b.hidden=true;document.body.appendChild(b);const e2=new MouseEvent('click',{bubbles:true});e2._fresh=true;b.dispatchEvent(e2);b.remove()});break}
      const[slot,src]=v.split('|'),s0=replay(m),l=JSON.parse(JSON.stringify((db.opp||{})[m.id]||{}));
      const outP=slot==='P'?l.pitcher:l.order[+slot];let inP;
      if(src==='new'){inP=ev._fresh&&window.__osNew?Object.assign({},window.__osNew):{num:(document.getElementById('osNum').value||'').trim(),prenom:(document.getElementById('osPre').value||'').trim(),nom:(document.getElementById('osNom').value||'').trim()};if(!inP.num&&!inP.prenom&&!inP.nom){toast('Indique au moins le numéro');break}}
      else{inP=l.bench.splice(+src,1)[0]}
      inP.pos=slot==='P'?'P':(outP.pos||'');
      if(slot==='P')l.pitcher=inP;else l.order[+slot]=inP;
      l.out=[...(l.out||[]),outP];l.subs=[...(l.subs||[]),{inn:s0.inn,half:halfLab(s0),slot:String(slot),pos:inP.pos,out:outP,in:inP,at:Date.now()}];
      close();db.opp[m.id]=l;render();
      api({action:'saveOppLineup',sheetId:m.id,lineup:l}).then(r=>{db.opp[m.id]=r.lineup;render();toast(`M${s0.inn} · ${slot==='P'?'lanceur : ':''}${(inP.prenom||'#'+inP.num)} remplace ${(outP.prenom||'#'+outP.num)}`)}).catch(e=>toast(e.status?e.message:'Pas de réseau · réessaie'));break}
    case'advadd':{const c=document.getElementById('advOrder');if(c&&c.children.length<12){const d=document.createElement('div');d.innerHTML=advV(m,replay(m)).match(/<div class="item"[\s\S]*?<\/div>/)[0].replace(/<span class="n">\d+<\/span>/,`<span class="n">${c.children.length+1}</span>`).replace(/value="[^"]*"/g,'value=""');c.appendChild(d.firstChild)}break}
    case'advcopy':{const src=(db.opp||{})[v];if(src){db.opp[m.id]=Object.assign({},src,{sheetId:m.id,date:m.date,updated:0,by:''});render();toast('Line-up repris · vérifie puis enregistre')}break}
    case'advsave':{const old=(db.opp||{})[m.id]||{};const l=Object.assign({out:old.out||[],subs:old.subs||[]},readAdv(),{date:m.date});
      api({action:'saveOppLineup',sheetId:m.id,lineup:l}).then(r=>{db.opp=db.opp||{};db.opp[m.id]=r.lineup;save();render();toast('Line-up adverse enregistré');loadScout()}).catch(e=>toast(e.status?e.message:'Pas de réseau · réessaie'));break}
    case'dhit':push({k:'DHIT',v});sprayAsk(v,null,true);toast({'1B':'Simple adverse','2B':'Double adverse','3B':'Triple adverse','HR':'Home run adverse'}[v]);break;
    case'drun':{const st=replay(m),i=+v;
      if(!st.dB[i]){push({k:'DR',i,a:'add'});break}
      const nxt=i<2&&!st.dB[i+1];
      sheet(`<h3>Coureur adverse en ${['1re','2e','3e'][i]}</h3><div class="list">
        ${i<2?`<button class="item" data-a="dr" data-v="${i}:adv" ${nxt?'':'disabled'}><span class="grow"><b>Avance en ${['2e','3e'][i]}</b><div class="muted" style="font-size:14px">stolen base, sur le jeu…${nxt?'':' (base occupée)'}</div></span></button>`:''}
        <button class="item" data-a="dr" data-v="${i}:score"><span class="grow"><b>Marque</b><div class="muted" style="font-size:14px">+1 point adverse</div></span></button>
        <button class="item" data-a="dr" data-v="${i}:out"><span class="grow"><b style="color:var(--out)">Out</b><div class="muted" style="font-size:14px">pris en vol, éliminé sur base… (+1 out)</div></span></button>
        <button class="item" data-a="dr" data-v="${i}:del"><span class="grow"><b>Enlever</b><div class="muted" style="font-size:14px">erreur de saisie</div></span></button>
      </div><button class="btn" data-a="close">Fermer</button>`);break}
    case'dr':{const[i,a]=v.split(':');close();const before=replay(m).half;push({k:'DR',i:+i,a});if(a==='out'&&before==='def'&&replay(M()).half==='att')toast('3 outs · on passe en attaque');break}
    case'opp':push({k:'OPP',inn:replay(m).inn,d:+v});break;
    case'endhalf':push({k:'END'});break;
    case'fin':push({k:'FIN'});break;
    case'undo':undo();break;
    case'wp':{const b3=replay(m).B[2];push({k:v});toast(v==='BK'?'Balk · tous les coureurs avancent':(v==='WP'?'Wild pitch':'Passed ball')+' · fais avancer à la main les coureurs qui ont bougé');break}
    case'fs':if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>toast('Plein écran refusé par le navigateur'));break;
    case'laysheet':sheet(`<h3>Affichage</h3><div class="list">${Object.entries(LAYS).map(([k,l])=>`<button class="item ${(db.settings.layout||'auto')===k?'sel':''}" data-a="setlay" data-v="${k}"><span class="grow"><b>${l}</b><div class="muted" style="font-size:14px">${{auto:'selon la taille et le sens de l’écran',mobile:'une colonne, boutons compacts',tp:'une colonne, gros boutons',tl:'deux colonnes : saisie à gauche, terrain à droite'}[k]}</div></span></button>`).join('')}</div><button class="btn" data-a="close">Fermer</button>`);break;
    case'setlay':db.settings.layout=v;save();document.getElementById('layer').innerHTML='';render();break;
    case'togcount':db.settings.count=!showCount();save();render();break;
    case'note':push({k:'N',txt:v});toast('Note ajoutée');break;
    case'notetxt':{const x=document.getElementById('ntxt').value.trim();if(x)push({k:'N',txt:x});break}
    case'copy':{const txt=recapText();navigator.clipboard?.writeText(txt).then(()=>toast('Récap copié'),()=>fallbackCopy(txt))||fallbackCopy(txt);break}
    case'export':exportFile();break;
    case'delm':{const x=db.matches[v];sheet(`<h3>Supprimer ce match ?</h3><p style="margin:0">${esc(x.opp)} · ${fmtDate(x.date)}</p><p class="muted" style="margin:0">Toutes les actions et stats de ce match seront effacées pour tout le staff. Les lancers de ce match ne compteront plus dans le total de la journée.</p><button class="btn" style="background:var(--out);color:#fff;border-color:var(--out)" data-a="delok" data-v="${v}">Supprimer définitivement</button><button class="btn" data-a="close">Annuler</button>`);break}
    case'delok':if(db.matches[v]&&db.matches[v].synced)db.deleted.push(v);delete db.matches[v];scheduleSync(0);if(db.current===v)db.current=null;save();close();render();toast('Match supprimé');break;
    case'first':m.first=v;touch(m);render();break;
  }
});
document.addEventListener('change',ev=>{
  if(ev.target.dataset&&ev.target.dataset.sprwho){if(ev.target.dataset.sprwho==='us')sprWho=ev.target.value;else sprWhoT=ev.target.value;render();return}
  if(ev.target.dataset&&ev.target.dataset.opos!=null){const m=M(),s0=replay(m),i=+ev.target.dataset.opos,l=JSON.parse(JSON.stringify((db.opp||{})[m.id]||{})),pl=l.order&&l.order[i];if(!pl)return;
    const from=pl.pos||'',to=ev.target.value;if(from===to)return;const j=l.order.findIndex((x,k)=>x&&k!==i&&x.pos===to&&to&&to!=='DH');
    pl.pos=to;if(j>=0)l.order[j].pos=from;
    l.subs=[...(l.subs||[]),{kind:'pos',inn:s0.inn,half:halfLab(s0),slot:String(i),who:pl,from,to,at:Date.now()}];db.opp[m.id]=l;render();
    api({action:'saveOppLineup',sheetId:m.id,lineup:l}).then(r=>{db.opp[m.id]=r.lineup;render();toast(`${pl.prenom||'#'+pl.num} → ${POSL[to]||to}`)}).catch(e=>toast(e.status?e.message:'Pas de réseau'));return}
  if(ev.target.id==='imp')importFile(ev.target.files[0]);
  if(ev.target.id==='link'){syncDraft();const v=ev.target.value,c=db.cal.find(x=>x.id===v);draft.link=v;
    if(c){if(c.opp)draft.opp=c.opp;draft.home=c.loc==='domicile';draft.kind=/amical|tournoi/i.test((c.label||'')+' '+(c.opp||''))?'amical':'saison';
      const lu=db.lineups[v]||{},ok=id=>db.roster.some(p=>p.id===id),def=lu.defense||{};
      const bat=(lu.batting||[]).filter(id=>id&&ok(id));if(bat.length)draft.lineup=bat;
      draft.pos={};Object.entries(def).forEach(([k,id])=>{if(APP2POS[k]&&ok(id))draft.pos[id]=APP2POS[k]});
      if(def['Lanceur']&&ok(def['Lanceur']))draft.pitcher=def['Lanceur'];
      if(def['Catcher']&&ok(def['Catcher']))draft.catcher=def['Catcher'];
      if(draft.pitcher&&bat.length&&!bat.includes(draft.pitcher)){draft.dhOn=true;draft.dh=lu.dh&&bat.includes(lu.dh)?lu.dh:null}
      toast(bat.length?'Composition reprise':'Pas encore de composition pour ce match')}
    render()}
});
function syncDraft(){const o=document.getElementById('opp'),d=document.getElementById('date');if(o)draft.opp=o.value;if(d)draft.date=d.value}
function fallbackCopy(txt){sheet(`<h3>Récap</h3><p class="muted" style="margin:0">Sélectionne et copie le texte.</p><textarea id="cp" style="width:100%;min-height:50vh;font:14px/1.4 var(--f-body);background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px">${esc(txt)}</textarea><button class="btn" data-a="close">Fermer</button>`);const ta=document.getElementById('cp');ta.focus();ta.select()}
function exportFile(){
  const blob=new Blob([JSON.stringify({matches:db.matches,settings:db.settings},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`dragons-matchs-${today()}.json`;document.body.appendChild(a);a.click();a.remove();
  toast('Fichier exporté');
}
function importFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.matches)throw 0;
  // fusion : on garde les deux, les données importées priment
  for(const mm of Object.values(d.matches)){mm.device=db.device;mm.dirty=true;mm.updated=Date.now();db.matches[mm.id]=mm}if(d.settings)db.settings=Object.assign(db.settings,d.settings);scheduleSync(0);save();render();toast('Import réussi')}catch(e){toast('Fichier non reconnu')}};r.readAsText(f)}

/* Écran allumé pendant le match */
let lock=null;async function wake(){try{if(view==='live'&&!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});

boot();
window.DragonsLogos&&DragonsLogos.ready.then(()=>{if(!document.querySelector('.sheet')&&!(document.activeElement&&['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)))render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/match/sw.js').catch(()=>{});
</script>
